name: Validate portfolio

on:
  pull_request:
    branches:
      - portfolio-of-pavel-afanasiev-0036f
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify the Vercel root-path build
        run: npm run build
        env:
          VERCEL: '1'
      - name: Type-check the Vercel API route
        run: npx tsc --noEmit --target es2023 --lib ES2023,DOM --module nodenext --moduleResolution nodenext --types node --skipLibCheck api/chat.ts
      - run: npm run lint
